<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>誰でもロードマップナレッジ</title>
    <meta name="description" content="コールセンターの問い合わせ対応を、ロードマップ形式で整理・共有するナレッジ共有アプリ" />

    <!-- ブラウザのタブに表示するアイコン -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- iPhone / iPad でホーム画面に追加した時のアイコン -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ロードマップナレッジ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Android / PC でアプリとして追加した時の設定（アイコンは manifest 内で指定） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f1117" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
